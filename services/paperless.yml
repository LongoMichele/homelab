services:
  broker:
    container_name: Redis
    image: docker.io/library/redis:8.0
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    container_name: Postgres
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME}
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER} -d ${PAPERLESS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  webserver:
    container_name: Paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
    ports:
      - "${PAPERLESS_PORT}:${PAPERLESS_PORT}"
    volumes:
      - ${PAPERLESS_DATA_VOLUME}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_VOLUME}:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_VOLUME}:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME_VOLUME}:/usr/src/paperless/consume
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:${PAPERLESS_PORT}/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

